<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
  <script defer src="detection.js"></script>
  <script defer src="sketch.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Face Filter Studio</title>
</head>
<body>
  <div class="layout">

    <!-- Camera -->
    <div class="camera-area">
      <div class="camera-header">
        <a class="back-link" href="https://mattewrobles.github.io">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <span class="camera-title">Face Filter Studio</span>
      </div>
      <div class="fx">
        <video id="video" width="640px" height="480px"></video>
        <div id="canvas-container"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="sidebar-block">
        <h1 class="sidebar-title">Crea tu<br><span>propio filtro</span></h1>
        <p class="sidebar-desc">Dibuja formas sobre tu rostro usando puntos de MediaPipe FaceMesh.</p>
      </div>

      <!-- Edit toggle -->
      <div class="sidebar-block" id="controls-edit"></div>

      <!-- Shape actions -->
      <div class="sidebar-block">
        <p class="block-label">Forma actual</p>
        <div id="controls-shape" class="btn-row"></div>
      </div>

      <!-- Extra actions -->
      <div class="sidebar-block">
        <p class="block-label">Guardar</p>
        <div id="controls-extra" class="icon-row"></div>
      </div>

      <!-- Fill sliders -->
      <div class="sidebar-block">
        <p class="block-label">Color de relleno</p>
        <div id="controls-fill" class="sliders-group"></div>
      </div>

      <!-- Stroke sliders -->
      <div class="sidebar-block">
        <p class="block-label">Color de contorno</p>
        <div id="controls-stroke" class="sliders-group"></div>
      </div>

      <!-- Shortcuts -->
      <div class="sidebar-block">
        <p class="block-label">Atajos de teclado</p>
        <div class="shortcuts">
          <span class="key">E</span><span>Edit mode</span>
          <span class="key">C</span><span>Completar</span>
          <span class="key">Z</span><span>Deshacer</span>
          <span class="key">D</span><span>Borrar</span>
          <span class="key">S</span><span>Screenshot</span>
          <span class="key">J</span><span>Guardar JSON</span>
        </div>
      </div>

      <div class="sidebar-block">
        <a href="https://github.com/mattewrobles/machine_learning_project/tree/main"
           target="_blank" rel="noopener noreferrer" class="docs-link">
          Ver documentación completa →
        </a>
      </div>

    </aside>
  </div>
</body>
</html>
